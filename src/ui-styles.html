<style>
/*
 * 共通スタイル（全画面で読み込む）
 * web-router.gs の include('ui-styles') から差し込まれます。
 * 配色を変えるときはここだけ直せば全画面に効きます。
 */
:root{
  --paper:#faf8f5; --card:#ffffff;
  --ink:#211f1c; --ink2:#635d56; --ink3:#9a938a;
  --rule:#e6e1d9; --rule2:#d3ccc1;
  --accent:#2f6f6a; --accent-soft:#e6f0ee;
  --ok:#3f7d5a; --ok-soft:#e9f2ec;
  --hold:#9a6a24; --hold-soft:#f8efdf;
  --warn:#a8452f; --warn-soft:#fbeae5;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 0 10px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink2);margin:0 0 16px}

.nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.nav a{
  padding:7px 13px;border:1px solid var(--rule2);border-radius:9px;background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none
}
.nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card-h{
  padding:11px 14px;border-bottom:1px solid var(--rule);font-size:13.5px;font-weight:650;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.card-b{padding:14px}

.btn{
  font:inherit;font-size:12.5px;font-weight:700;background:var(--accent);color:#fff;border:0;
  padding:6px 14px;border-radius:7px;cursor:pointer;white-space:nowrap
}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ok{background:var(--ok)}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.todo{background:var(--hold-soft);color:var(--hold)}
.pill.opt{background:var(--paper);color:var(--ink3);border:1px solid var(--rule)}
.pill.bad{background:var(--warn-soft);color:var(--warn)}

.hint{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:6px}
.hint a{color:var(--accent)}
.warnbox{
  font-size:12px;color:var(--warn);background:var(--warn-soft);
  border-radius:7px;padding:9px 11px;margin-top:9px;line-height:1.6
}
.okbox{
  font-size:12px;color:var(--ok);background:var(--ok-soft);
  border-radius:7px;padding:9px 11px;margin-top:9px;line-height:1.6
}
.notebox{
  font-size:12px;color:var(--hold);background:var(--hold-soft);
  border-radius:7px;padding:9px 11px;margin-top:9px;line-height:1.6
}

.empty{text-align:center;padding:44px 20px;color:var(--ink3);font-size:14px}
.loading{text-align:center;padding:38px;color:var(--ink3);font-size:14px}
.hide{display:none}
.mono{font-family:var(--mono)}

#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:99px;font-size:13px;
  font-weight:600;transition:transform .22s ease;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18)
}
#toast.show{transform:translateX(-50%) translateY(0)}
.foot{margin-top:26px;font-size:11.5px;color:var(--ink3);line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
</style>
