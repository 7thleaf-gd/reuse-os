<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><base target="_top"><?!= include('ui-styles') ?>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.inv{padding:12px 14px;border-top:1px solid var(--rule)}.inv:first-child{border-top:none}.sku{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}.nm{font-weight:650;margin:2px 0}.meta{font-size:12px;color:var(--ink2);line-height:1.6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}input,select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:9px;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);color:var(--ink)}label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}</style></head>
<body><div class="wrap"><h1>在庫</h1><p class="sub">商品登録 → 在庫 → 出品 → RESERVED / SOLD。状態正本は中央在庫だけです。</p><div class="nav" id="nav"></div>
<h2>商品登録</h2><div class="card"><div class="card-b"><div class="grid"><div><label>商品名</label><input id="name"></div><div><label>カテゴリ</label><select id="cat"><option>UNKNOWN</option><option>MUSIC</option><option>BOOK</option><option>GAME</option><option>GEAR</option><option>CAMERA</option><option>ANTIQUE</option><option>FIGURINE</option><option>JUNK_ELECTRONICS</option></select></div><div><label>形式</label><input id="fmt" placeholder="CD / Vinyl / Camera ..."></div><div><label>仕入価格</label><input id="cost" type="number" min="0"></div><div><label>想定売価</label><input id="est" type="number" min="0"></div><div><label>通貨</label><input id="cur" value="JPY"></div></div><div class="actions"><button class="btn" onclick="addItem()">中央在庫へ登録</button></div><div id="msg" class="hint"></div></div></div>
<h2>中央在庫</h2><div id="list" class="card"><div class="loading">読み込み中…</div></div></div><div id="toast"></div>
<script>var ST=null;function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},1800)}
function load(){google.script.run.withSuccessHandler(function(st){ST=st;var b=st.webAppUrl||'';document.getElementById('nav').innerHTML='<a href="'+esc(b)+'">ホーム</a><a class="on" href="'+esc(b)+'?page=inventory">在庫</a><a href="'+esc(b)+'?page=listing">出品ヘルパー</a><a href="'+esc(b)+'?page=setup">セットアップ</a>';render()}).withFailureHandler(function(e){document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}).getInventoryDashboard()}
function render(){var h='';if(!ST.rows.length){h='<div class="empty">在庫はまだありません</div>'}else ST.rows.forEach(function(r){var stat=String(r['Status']||'');h+='<div class="inv"><div class="sku">'+esc(r['SKU'])+'</div><div class="nm">'+esc(r['Product Name'])+'</div><div class="meta">'+esc(r['Category'])+(r['Format']?' · '+esc(r['Format']):'')+'<br>仕入 '+esc(r['Cost'])+' / 想定 '+esc(r['Est. Price'])+' '+esc(r['Est. Currency'])+'</div><div class="chips"><span class="pill '+(stat==='AVAILABLE'?'done':stat==='SOLD'?'opt':'todo')+'">'+esc(stat)+'</span>';(r.channels||[]).forEach(function(c){h+='<span class="pill opt">'+esc(c.channel)+': '+esc(c.status)+'</span>'});h+='</div><div class="actions"><button class="btn ghost" onclick="markListed(\''+esc(r['SKU'])+'\')" '+(stat!=='AVAILABLE'?'disabled':'')+'>出品済みを記録</button>';if(String(r['Sync State']||'').indexOf('FAIL')>=0||String(r['Sync State']||'').indexOf('MANUAL')>=0)h+='<button class="btn ghost" onclick="retry(\''+esc(r['SKU'])+'\')">失敗だけ再試行</button>';h+='</div></div>'});document.getElementById('list').innerHTML=h}
function addItem(){var x={productName:document.getElementById('name').value,category:document.getElementById('cat').value,format:document.getElementById('fmt').value,costPrice:document.getElementById('cost').value,estimatedPrice:document.getElementById('est').value,currency:document.getElementById('cur').value};document.getElementById('msg').textContent='登録中…';google.script.run.withSuccessHandler(function(r){document.getElementById('msg').textContent=r.note;if(r.ok){toast(r.sku+' 登録');load()}}).withFailureHandler(function(e){document.getElementById('msg').textContent=e.message}).createInventoryFromUi(x)}
function markListed(sku){var ch=prompt('販路名（例: EBAY / MERCARI_PERSONAL）');if(!ch)return;var id=prompt('その販路の出品ID / URL');if(!id)return;google.script.run.withSuccessHandler(function(r){toast(r.note);load()}).registerListedFromUi(sku,ch,id)}function retry(sku){google.script.run.withSuccessHandler(function(r){toast(r.note||'再試行しました');load()}).retryInventoryFromUi(sku)}load();</script></body></html>
