<body><div class="wrap"><h1>REUSE OS</h1><p class="sub">中央在庫 → 出品 → 売却検知 → RESERVED / SOLD同期</p><div id="gate"><div class="loading">読み込み中…</div></div><div class="foot">Hunterはこの商品UIには含まれません。中央在庫だけが状態正本です。</div></div><div id="toast"></div>

google.script.run.withSuccessHandler(function(st){var base=st.webAppUrl||'',html='';if(!st.allRequiredDone){html+='<div class="card"><div class="card-b"><div class="status"><span class="pill todo">セットアップ未完了</span><span style="font-size:13px;color:var(--ink2)">必須 '+st.requiredDone+' / '+st.requiredTotal+'</span></div><div class="notebox">まず中央在庫のSheetと商品画像のDriveだけ設定してください。販路認証は使う販路だけ後から接続できます。</div></div></div>'}else{html+='<div class="card"><div class="card-b"><div class="status"><span class="pill done">基本セットアップ完了</span><span style="font-size:13px;color:var(--ink2)">中央在庫を使えます</span></div></div></div>'}
html+='<a class="big card" href="'+esc(base)+'?page=inventory"><div class="card-b"><div class="ic">📦</div><div class="tx"><div class="t">中央在庫</div><div class="d">商品登録・在庫確認・出品状態・RESERVED / SOLDを確認</div></div><div class="go">›</div></div></a>';
html+='<a class="big card" href="'+esc(base)+'?page=listing"><div class="card-b"><div class="ic">📋</div><div class="tx"><div class="t">出品ヘルパー</div><div class="d">手動販路向けの出品文と操作支援</div></div><div class="go">›</div></div></a>';
html+='<a class="big card" href="'+esc(base)+'?page=setup"><div class="card-b"><div class="ic">⚙️</div><div class="tx"><div class="t">セットアップ</div><div class="d">中央在庫と販路認証。eBayは画面からOAuth接続</div></div><div class="go">›</div></div></a>';document.getElementById('gate').innerHTML=html}).withFailureHandler(function(e){document.getElementById('gate').innerHTML='<div class="empty">読み込みに失敗しました<br>'+esc(e.message)+'</div>'}).getSetupStatus();</script></body></html>
